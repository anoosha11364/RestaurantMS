<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — RestaurantMS</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<div id="toast-container" class="toast-container"></div>

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <span class="auth-logo-icon">🍽️</span>
      <h1>Restaurant<span>MS</span></h1>
      <p>Create your customer account</p>
    </div>

    <!-- Register Form -->
    <form class="auth-form" id="register-form">
      <div class="form-group">
        <label class="form-label" for="fullname">Full Name</label>
        <input class="form-control" type="text" id="fullname" placeholder="John Doe" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-control" type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-control" type="text" id="phone" placeholder="03XXXXXXXXX" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" placeholder="Min. 6 characters" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <input class="form-control" type="password" id="confirm-password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" id="register-btn" style="margin-top:.5rem">
        ✨ Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="../index.html">Sign in</a>
    </div>

  </div>
</div>

<script src="../js/utils.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault()
    const btn      = document.getElementById('register-btn')
    const fullName = document.getElementById('fullname').value
    const email    = document.getElementById('email').value
    const phone    = document.getElementById('phone').value
    const password = document.getElementById('password').value
    const confirm  = document.getElementById('confirm-password').value

    if (password.length < 6) return toast('Password must be at least 6 characters.', 'warning')
    if (password !== confirm) return toast('Passwords do not match.', 'warning')

    setLoading(btn, true)
    try {
      await api.post('/auth/register', { fullName, email, password, phone })
      toast('Account created! Please sign in. 🎉')
      setTimeout(() => { window.location.href = '../index.html' }, 1000)
    } catch (err) {
      toast(err?.message || 'Registration failed.', 'error')
      setLoading(btn, false)
    }
  })
</script>
</body>
</html>
